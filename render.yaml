# render.yaml — Render Blueprint for one-click deployment
# Docs: https://docs.render.com/blueprint-spec

services:
  # ── Backend (FastAPI) ──────────────────────────────
  - type: web
    name: kaggle-hackathon-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false  # Set manually in dashboard
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: agency-rag
      - key: PINECONE_DIMENSION
        value: "768"
      - key: GEMINI_EMBEDDING_MODEL
        value: text-embedding-004
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: ENABLE_PII_SHIELD
        value: "false"
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.10"

  # ── Frontend (React/Vite Static Site) ──────────────
  - type: web
    name: kaggle-hackathon-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # Set to your backend URL after first deploy
